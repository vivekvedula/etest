<!DOCTYPE html>
<html>
<head>
    <title>Create Test</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f4f8;
            margin: 0;
            padding: 0;
        }

        .container {
            width: 500px;
            margin: 60px auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px rgba(0,0,0,0.1);
        }

        h2 {
            text-align: center;
            color: #333;
            margin-bottom: 20px;
        }

        form {
            display: flex;
            flex-direction: column;
        }

        input, textarea {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        label {
            font-weight: bold;
            margin-top: 10px;
        }

        button {
            background-color: #007bff;
            color: white;
            padding: 10px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background-color: #0056b3;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 15px;
        }

        .back a {
            color: #007bff;
            text-decoration: none;
        }

        .back a:hover {
            text-decoration: underline;
        }

    </style>
</head>

<body>

<div class="container">

    <h2>Create New Test</h2>

    <form method="POST">
        {% csrf_token %}

        <label>Title</label>
        {{ form.title }}

        <label>Description</label>
        {{ form.description }}

        <label>Duration (minutes)</label>
        {{ form.duration }}

        <label>Total Marks</label>
        {{ form.total_marks }}

        <button type="submit">Create Test</button>
    </form>

    <div class="back">
        <a href="{% url 'admin_dash' %}">← Back to Dashboard</a>
    </div>

</div>

</body>
</html>
