<!DOCTYPE html>
<html>
<head>
    <title>View Results</title>

    <style>
        body {
            font-family: Arial;
            background: #f4f4f4;
            margin: 20px;
        }

        h1 {
            text-align: center;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
        }

        th, td {
            border: 1px solid #ccc;
            padding: 10px;
            text-align: center;
        }

        th {
            background: #007bff;
            color: white;
        }

        tr:nth-child(even) {
            background: #f2f2f2;
        }
    </style>
</head>

<body>

<h1>All Test Results</h1>

<table>
    <tr>
        <th>User</th>
        <th>Test</th>
        <th>Score</th>
        <th>Date</th>
    </tr>

    {% for r in results %}
    <tr>
        <td>{{ r.user.username }}</td>
        <td>{{ r.test.title }}</td>
        <td>{{ r.score }}</td>
        <td>{{ r.submitted_at }}</td>
    </tr>
    {% empty %}
    <tr>
        <td colspan="4">No results found</td>
    </tr>
    {% endfor %}
</table>

</body>
</html>
