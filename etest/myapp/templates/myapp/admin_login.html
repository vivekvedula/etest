<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Admin Login - E-Test</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f4;
    }

    .container {
      width: 350px;
      margin: 80px auto;
      padding: 30px;
      background-color: #fff;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
    }

    h2 {
      text-align: center;
      color: #333;
    }

    input[type=email],
    input[type=password] {
      width: 100%;
      padding: 10px;
      margin: 8px 0 15px 0;
      border: 1px solid #ccc;
      border-radius: 4px;
    }

    button {
      width: 100%;
      padding: 10px;
      background-color: #4CAF50;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 16px;
    }

    button:hover {
      background-color: #45a049;
    }

    .links {
      text-align: center;
      margin-top: 15px;
    }

    .links a {
      color: #4CAF50;
      text-decoration: none;
      margin: 0 5px;
    }

    .links a:hover {
      text-decoration: underline;
    }

    ul {
      list-style: none;
      padding: 0;
      text-align: center;
    }

    ul li {
      margin: 5px 0;
    }
  </style>
</head>

<body>
  <div class="container">
    <h2>Admin Login</h2>

    <!-- Display messages -->
    {% if messages %}
    {% for message in messages %}
    <p style="color:{% if message.tags == 'error' %}red{% else %}green{% endif %}; text-align:center;">
      {{ message }}
    </p>
    {% endfor %}
    {% endif %}

    <!-- Login Form -->
    <form action="/admin_login/" method="post">
      {% csrf_token %}
      <input type="email" name="email" placeholder="Admin Email" required>
      <input type="password" name="password" placeholder="Password" required>
      <button type="submit">Login</button>
    </form>

    <!-- Links Section -->
    <div class="links">
      <p><a href="/admin-forgot-password/">Forgot Password?</a> | <a href="/student_login/">Student Login</a></p>

      <p>Don't have an account? <a href="{% url 'create_account' %}">Create Account</a></p>

      <p>Or select your role to create account:</p>
      <ul>
        <li><a href="{% url 'create_account' %}?role=student">Create Student Account</a></li>
        <li><a href="{% url 'create_account' %}?role=admin">Create Admin Account</a></li>
      </ul>
    </div>
  </div>
</body>

</html>
