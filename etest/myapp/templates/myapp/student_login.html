<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Student Login - E-Test</title>
<style>
  body { font-family: Arial; background: #f4f4f4; }
  .container { width: 350px; margin: 80px auto; padding: 30px; background: #fff; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
  h2 { text-align: center; color: #333; }
  input[type=email], input[type=password] { width: 100%; padding: 10px; margin: 8px 0 15px; border: 1px solid #ccc; border-radius: 4px; }
  button { width: 100%; padding: 10px; background: #3498db; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; }
  button:hover { background: #2980b9; }
  .links { text-align: center; margin-top: 15px; }
  .links a { color: #3498db; text-decoration: none; margin: 0 5px; }
  .links a:hover { text-decoration: underline; }
  .note { text-align: center; font-size: 14px; color: #555; margin-top: 10px; }
  .error { color: red; text-align: center; margin-bottom: 10px; }
</style>
</head>
<body>
  <div class="container">
    <h2>Student Login</h2>
    <form method="post" action="">
      {% csrf_token %}
      {% if error %}<div class="error">{{ error }}</div>{% endif %}
      <input type="email" name="email" placeholder="Student Email" required>
      <input type="password" name="password" placeholder="Password" required>
      <button type="submit">Login</button>
    </form>
    <div class="links">
      <a href="/student-forgot-password/">Forgot Password?</a> |
      <a href="/admin_login/">Admin Login</a>
    </div>
    <div class="note">
      <p>Please use the email provided by your instructor.</p>
    </div>
  </div>
</body>
</html>
