<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Login Form (GET)</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 50px;
        }

        form {
            max-width: 300px;
        }

        label {
            display: block;
            margin-top: 10px;
        }

        input {
            width: 100%;
            padding: 5px;
            margin-top: 5px;
        }

        button {
            margin-top: 15px;
            padding: 8px 12px;
        }

        p.message {
            margin-top: 20px;
            font-weight: bold;
            color: green;
        }
    </style>
</head>

<body>
    <h2>Login Form (GET)</h2>

    <form method="GET">
        <label>Username:</label>
        <input type="text" name="username" value="{{ request.GET.username }}">

        <label>Password:</label>
        <input type="password" name="password" value="{{ request.GET.password }}">

        <button type="submit">Login</button>
    </form>

    {% if message %}
    <p class="message">{{ message }}</p>
    {% endif %}
</body>

</html>
