<!DOCTYPE html>
<html>
<head>
    <title>Admin Dashboard</title>

    <style>
        body {
            font-family: Arial;
            background: #f7f7f7;
            margin: 20px;
        }

        h1 {
            text-align: center;
        }

        .overview {
            display: flex;
            justify-content: space-around;
            margin: 20px 0;
        }

        .card {
            background: white;
            padding: 15px;
            border: 1px solid #ccc;
            width: 22%;
            text-align: center;
            border-radius: 5px;
        }

        .section {
            background: white;
            padding: 15px;
            margin-top: 15px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        .section a {
            display: inline-block;
            margin: 5px;
            padding: 8px 12px;
            background: #007bff;
            color: white;
            text-decoration: none;
            border-radius: 4px;
        }

        .section a:hover {
            background: #0056b3;
        }
    </style>
</head>

<body>

<h1>Admin Dashboard</h1>

<!-- OVERVIEW -->
<div class="overview">
    <div class="card">Tests: {{ total_tests }}</div>
    <div class="card">Students: {{ total_students }}</div>
    <div class="card">Admins: {{ total_admins }}</div>
    <div class="card">Results: {{ total_results }}</div>
</div>

<!-- TEST MANAGEMENT -->
<div class="section">
    <h2>Test Management</h2>
    <a href="{% url 'create_test' %}">Create Test</a>
    <a href="{% url 'view_tests' %}">View Tests</a>
</div>

<!-- QUESTION MANAGEMENT -->
<div class="section">
    <h2>Question Management</h2>
    <a href="{% url 'add_question' %}">Add Question</a>
    <a href="{% url 'view_questions' %}">View Questions</a>
</div>

<!-- RESULTS -->
<div class="section">
    <h2>Result Management</h2>
    <a href="{% url 'view_results' %}">View Results</a>
</div>

</body>
</html>
